name: Build and test TCP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ThuVienDAU.sln --locked-mode
      - run: dotnet build ThuVienDAU.sln --configuration Release --no-restore
      - run: dotnet run --project cong_cu/kiem_tra_tcp --configuration Release -- .
      - run: dotnet run --project cong_cu/kiem_tra_tv2_client --configuration Release
